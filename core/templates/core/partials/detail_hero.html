{% load ui_tags %}
<section class="border-b border-gray-200 bg-white">
    <div class="mx-auto max-w-3xl px-6 py-16 text-center">
        <h1 class="text-4xl font-semibold tracking-tight text-navy-950">{{ title }}</h1>
        {% if subtitle %}
            <p class="mt-4 text-lg leading-relaxed text-ink/70">{{ subtitle }}</p>
        {% endif %}
        {% if cta_label %}
            <div class="mt-8 flex justify-center">
                {% button cta_label cta_url|default:"/contact/" "primary" %}
            </div>
        {% endif %}
    </div>
</section>
