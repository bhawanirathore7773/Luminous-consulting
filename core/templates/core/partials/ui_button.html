{% if variant == "primary" %}
<a href="{{ url }}" class="inline-flex items-center justify-center rounded-md bg-accent px-5 py-3 text-sm font-medium text-white transition-colors hover:bg-accent-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">{{ label }}</a>
{% elif variant == "secondary" %}
<a href="{{ url }}" class="inline-flex items-center justify-center rounded-md border border-navy-800/20 px-5 py-3 text-sm font-medium text-ink transition-colors hover:border-navy-800/40 hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">{{ label }}</a>
{% else %}
<a href="{{ url }}" class="inline-flex items-center text-sm font-medium text-accent underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">{{ label }}</a>
{% endif %}
