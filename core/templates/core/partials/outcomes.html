<section class="bg-navy-950 text-white">
    <div class="mx-auto max-w-7xl px-6 py-20">
        <h2 class="max-w-lg text-3xl font-semibold tracking-tight">We solve business problems through SAP.</h2>

        <div class="mt-12 grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-3">
            {% for pillar in outcomes %}
                <div class="border-t border-white/15 pt-5">
                    <p class="font-medium text-white">{{ pillar.name }}</p>
                    <p class="mt-2 text-sm leading-relaxed text-white/60">{{ pillar.description }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
