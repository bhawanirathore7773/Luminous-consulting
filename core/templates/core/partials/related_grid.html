<section class="bg-gray-50">
    <div class="mx-auto max-w-7xl px-6 py-16">
        <h2 class="text-2xl font-semibold tracking-tight text-navy-950">{{ heading }}</h2>
        <div class="mt-8 grid gap-px overflow-hidden rounded-md border border-gray-200 bg-gray-200 sm:grid-cols-3">
            {% for item in items %}
                <a href="{{ item.get_absolute_url }}" class="group flex flex-col gap-2 bg-white p-6 transition-colors hover:bg-gray-50">
                    <p class="font-medium text-navy-950 group-hover:text-accent">{{ item.name }}</p>
                    <p class="text-sm leading-relaxed text-ink/70">{{ item.short_summary }}</p>
                </a>
            {% endfor %}
        </div>
    </div>
</section>
