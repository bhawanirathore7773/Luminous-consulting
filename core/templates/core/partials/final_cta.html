{% load ui_tags %}
<section class="border-y border-gray-200 bg-gray-50">
    <div class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-6 px-6 py-16 sm:flex-row sm:items-center">
        <div>
            <h2 class="text-2xl font-semibold tracking-tight text-navy-950">{{ cta_heading|default:"Tell us what you're trying to solve." }}</h2>
            <p class="mt-2 text-ink/70">{{ cta_subtext|default:"A short conversation with an SAP specialist, no obligation." }}</p>
        </div>
        {% button cta_label|default:"Talk to an SAP Expert" cta_url|default:"/contact/" "primary" %}
    </div>
</section>
