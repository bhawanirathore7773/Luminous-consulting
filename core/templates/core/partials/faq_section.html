<section class="bg-white">
    <div class="mx-auto max-w-3xl px-6 py-14">
        <h2 class="text-2xl font-semibold tracking-tight text-navy-950">Frequently asked questions</h2>
        <div class="mt-6 divide-y divide-gray-200 border-t border-gray-200">
            {% for faq in faqs %}
                <details class="group py-4">
                    <summary class="flex list-none cursor-pointer items-center justify-between gap-4 text-ink">
                        <span class="font-medium text-navy-950">{{ faq.question }}</span>
                        <svg class="h-4 w-4 flex-none text-ink/50 transition-transform duration-150 group-open:rotate-45" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M8 2V14M2 8H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </summary>
                    <p class="mt-3 leading-relaxed text-ink/70">{{ faq.answer }}</p>
                </details>
            {% endfor %}
        </div>
    </div>
</section>
