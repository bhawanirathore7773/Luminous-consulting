<section class="{% if bg == 'gray' %}bg-gray-50{% else %}bg-white{% endif %}">
    <div class="mx-auto max-w-3xl px-6 py-14">
        <h2 class="text-2xl font-semibold tracking-tight text-navy-950">{{ heading }}</h2>
        <ul class="mt-5 space-y-3">
            {% for item in items %}
                <li class="flex gap-3 text-ink/80">
                    <span class="mt-2 h-1.5 w-1.5 flex-none rounded-full bg-accent"></span>
                    <span>{{ item.text }}</span>
                </li>
            {% endfor %}
        </ul>
    </div>
</section>
