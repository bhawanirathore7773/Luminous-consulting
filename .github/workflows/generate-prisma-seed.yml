name: Generate Prisma Seed Data

on:
  push:
    branches:
      - migration/nestjs-prisma-mysql-hostinger

permissions:
  contents: write

jobs:
  export-seed:
    if: ${{ !contains(github.event.head_commit.message, '[seed-export]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export canonical Django seed data
        run: python backend/scripts/export_django_seed.py

      - name: Commit generated Prisma seed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/source-data/
          if git diff --cached --quiet; then
            echo "No seed data changes."
            exit 0
          fi
          git commit -m "Generate Prisma seed data [seed-export]"
          git push origin HEAD:${GITHUB_REF_NAME}
